<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
    <marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
  </defs>
  <rect width="1180" height="640" fill="#ffffff"/>
  <text x="40" y="44" font-size="19" fill="#0f172a" text-anchor="start" font-weight="700">Where drift gets caught</text>
  <rect x="30" y="66" width="1120" height="190" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="54" y="98" font-size="15.5" fill="#92400e" text-anchor="start" font-weight="700">Before: the consumer finds it, if anyone does</text>
  <rect x="54" y="124" width="230" height="104" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="169.0" y="158.8" font-size="15.5" font-weight="650" fill="#0f172a" text-anchor="middle">Published core</text>
  <text x="169.0" y="183.7" font-size="12.8" fill="#475569" text-anchor="middle">links risk to customer</text>
  <text x="169.0" y="202.5" font-size="12.8" fill="#475569" text-anchor="middle">with riskCustomer</text>
  <rect x="324" y="124" width="230" height="104" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="439.0" y="158.8" font-size="15.5" font-weight="650" fill="#0f172a" text-anchor="middle">Agent writes the query</text>
  <text x="439.0" y="183.7" font-size="12.8" fill="#475569" text-anchor="middle">from the contract,</text>
  <text x="439.0" y="202.5" font-size="12.8" fill="#475569" text-anchor="middle">correctly</text>
  <rect x="594" y="124" width="230" height="104" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="709.0" y="158.8" font-size="15.5" font-weight="650" fill="#0f172a" text-anchor="middle">Federated join</text>
  <text x="709.0" y="183.7" font-size="12.8" fill="#475569" text-anchor="middle">Risk actually publishes</text>
  <text x="709.0" y="202.5" font-size="12.8" fill="#475569" text-anchor="middle">forCustomer</text>
  <rect x="864" y="124" width="262" height="104" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="995.0" y="158.8" font-size="15.5" font-weight="650" fill="#92400e" text-anchor="middle">0 rows, no error</text>
  <text x="995.0" y="183.7" font-size="12.8" fill="#b45309" text-anchor="middle">the agent reports</text>
  <text x="995.0" y="202.5" font-size="12.8" fill="#b45309" text-anchor="middle">"none"</text>
  <line x1="284" y1="176" x2="322" y2="176" stroke="#d97706" stroke-width="1.7" marker-end="url(#arrA)"/>
  <line x1="554" y1="176" x2="592" y2="176" stroke="#d97706" stroke-width="1.7" marker-end="url(#arrA)"/>
  <line x1="824" y1="176" x2="862" y2="176" stroke="#d97706" stroke-width="1.7" marker-end="url(#arrA)"/>
  <rect x="30" y="286" width="1120" height="326" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="54" y="318" font-size="15.5" fill="#065f46" text-anchor="start" font-weight="700">After: drift fails before it ships, and each kind has its own guard</text>
  <text x="54" y="350" font-size="13.5" fill="#047857" text-anchor="start" font-weight="650">Producer drift</text>
  <rect x="54" y="362" width="230" height="92" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="169.0" y="390.8" font-size="15.5" font-weight="650" fill="#0f172a" text-anchor="middle">Producer output</text>
  <text x="169.0" y="415.6" font-size="12.8" fill="#475569" text-anchor="middle">short IRI, untyped amount,</text>
  <text x="169.0" y="434.4" font-size="12.8" fill="#475569" text-anchor="middle">missing provenance</text>
  <rect x="324" y="362" width="230" height="92" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="439.0" y="400.2" font-size="15.5" font-weight="650" fill="#065f46" text-anchor="middle">SHACL shapes</text>
  <text x="439.0" y="425.1" font-size="12.8" fill="#047857" text-anchor="middle">in the data product contract</text>
  <rect x="594" y="362" width="532" height="92" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="860.0" y="400.2" font-size="15.5" font-weight="650" fill="#065f46" text-anchor="middle">Violation: the build fails, nothing is published</text>
  <text x="860.0" y="425.1" font-size="12.8" fill="#047857" text-anchor="middle">Accounts and Transactions refuse to write; CI checks every domain</text>
  <line x1="284" y1="408" x2="322" y2="408" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <line x1="554" y1="408" x2="592" y2="408" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <text x="54" y="486" font-size="13.5" fill="#047857" text-anchor="start" font-weight="650">Contract drift</text>
  <rect x="54" y="498" width="230" height="92" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="169.0" y="526.9" font-size="15.5" font-weight="650" fill="#3730a3" text-anchor="middle">One core 1.0.0</text>
  <text x="169.0" y="551.6" font-size="12.8" fill="#4f46e5" text-anchor="middle">riskCustomer deprecated,</text>
  <text x="169.0" y="570.4" font-size="12.8" fill="#4f46e5" text-anchor="middle">points at forCustomer</text>
  <rect x="324" y="498" width="230" height="92" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="439.0" y="526.9" font-size="15.5" font-weight="650" fill="#065f46" text-anchor="middle">Churn contract test</text>
  <text x="439.0" y="551.6" font-size="12.8" fill="#047857" text-anchor="middle">the query a consumer</text>
  <text x="439.0" y="570.4" font-size="12.8" fill="#047857" text-anchor="middle">would write, run in CI</text>
  <rect x="594" y="498" width="532" height="92" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="860.0" y="536.2" font-size="15.5" font-weight="650" fill="#065f46" text-anchor="middle">The known high-risk customer comes back, or CI fails</text>
  <text x="860.0" y="561.0" font-size="12.8" fill="#047857" text-anchor="middle">SHACL cannot see this one: the producers were already right</text>
  <line x1="284" y1="544" x2="322" y2="544" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <line x1="554" y1="544" x2="592" y2="544" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
</svg>
