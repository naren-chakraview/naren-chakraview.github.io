  <text x="370.0" y="263" font-size="12" fill="#334155" text-anchor="middle">action, classification</text>
  <text x="370.0" y="249" font-size="12" fill="#334155" text-anchor="middle">evaluate user_id, role,</text>
  <rect x="866" y="244" width="274" height="78" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="884" cy="264" r="10" fill="#f59e0b"/>
  <text x="884" y="268.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="902" y="269" font-size="12.5" fill="#92400e">Every input describes a person.</text>
  <text x="902" y="285" font-size="12.5" fill="#92400e">Which user_role does an agent</text>
  <text x="902" y="301" font-size="12.5" fill="#92400e">get, and whose identity is it?</text>
  <circle cx="280.1" cy="245" r="9" fill="#f59e0b"/>
  <text x="280.1" y="249" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <line x1="460" y1="330" x2="282" y2="330" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <circle cx="446" cy="330" r="0" fill="none"/>
  <text x="370.0" y="323" font-size="12" fill="#334155" text-anchor="middle">role: needs approval</text>
  <text x="370.0" y="309" font-size="12" fill="#334155" text-anchor="middle">sensitive for this</text>
  <line x1="280" y1="390" x2="618" y2="390" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <circle cx="294" cy="390" r="0" fill="none"/>
  <text x="450.0" y="383" font-size="12" fill="#334155" text-anchor="middle">2-hour SLA</text>
  <text x="450.0" y="369" font-size="12" fill="#334155" text-anchor="middle">route to owner,</text>
  <rect x="866" y="364" width="274" height="78" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="884" cy="384" r="10" fill="#f59e0b"/>
  <text x="884" y="388.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="902" y="389" font-size="12.5" fill="#92400e">Hours per approval, against</text>
  <text x="902" y="405" font-size="12.5" fill="#92400e">hundreds of queries a minute</text>
  <text x="902" y="421" font-size="12.5" fill="#92400e">across three domains.</text>
  <circle cx="386.5" cy="365" r="9" fill="#f59e0b"/>
  <text x="386.5" y="369" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <line x1="620" y1="450" x2="102" y2="450" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <circle cx="606" cy="450" r="0" fill="none"/>
  <text x="360.0" y="443" font-size="12" fill="#334155" text-anchor="middle">approved</text>
  <line x1="100" y1="510" x2="773" y2="510" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <circle cx="114" cy="510" r="0" fill="none"/>
  <text x="437.5" y="503" font-size="12" fill="#334155" text-anchor="middle">query fraud scores</text>
  <line x1="775" y1="570" x2="462" y2="570" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <circle cx="761" cy="570" r="0" fill="none"/>
  <text x="617.5" y="563" font-size="12" fill="#334155" text-anchor="middle">this role?</text>
  <text x="617.5" y="549" font-size="12" fill="#334155" text-anchor="middle">masking for</text>
  <line x1="460" y1="630" x2="773" y2="630" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <circle cx="474" cy="630" r="0" fill="none"/>
  <text x="617.5" y="623" font-size="12" fill="#334155" text-anchor="middle">column</text>
  <text x="617.5" y="609" font-size="12" fill="#334155" text-anchor="middle">strategy per</text>
  <line x1="775" y1="690" x2="102" y2="690" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <circle cx="761" cy="690" r="0" fill="none"/>
  <text x="437.5" y="683" font-size="12" fill="#334155" text-anchor="middle">masked rows, audit written</text>
  <rect x="866" y="664" width="274" height="62" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="884" cy="684" r="10" fill="#f59e0b"/>
  <text x="884" y="688.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="902" y="689" font-size="12.5" fill="#92400e">The audit log names the person,</text>
  <text x="902" y="705" font-size="12.5" fill="#92400e">even when an agent acted.</text>
  <circle cx="337.7" cy="679" r="9" fill="#f59e0b"/>
  <text x="337.7" y="683" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="28" y="746" width="804" height="40" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="430" y="771" font-size="14" font-weight="600" fill="#065f46" text-anchor="middle">Every input to every decision on this path describes a person.</text>
  <text x="28" y="826" font-size="13.5" fill="#64748b">The access request as designed in the fintech mesh. Numbered markers show where an autonomous, machine-speed consumer breaks the assumption.</text>
