  <text x="190.0" y="143" font-size="12" fill="#334155" text-anchor="middle">contract</text>
  <text x="190.0" y="129" font-size="12" fill="#334155" text-anchor="middle">read fraud_scores</text>
  <rect x="866" y="124" width="274" height="78" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="884" cy="144" r="10" fill="#f59e0b"/>
  <text x="884" y="148.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="902" y="149" font-size="12.5" fill="#92400e">The contract carries schema and</text>
  <text x="902" y="165" font-size="12.5" fill="#92400e">SLAs, not meaning. An agent can</text>
  <text x="902" y="181" font-size="12.5" fill="#92400e">only use what is declared.</text>
