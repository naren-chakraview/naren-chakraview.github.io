  <text x="620" y="67" font-size="11.5" fill="#64748b" text-anchor="middle">Risk and Compliance</text>
  <line x1="620" y1="80" x2="620" y2="730" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="703" y="24" width="144" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
