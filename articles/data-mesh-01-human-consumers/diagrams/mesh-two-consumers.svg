<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 680" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="1180" height="680" fill="#ffffff"/>

  <!-- LEFT: the consumer the mesh was built for -->
  <rect x="40" y="40" width="330" height="560" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="62" y="76" font-size="18" font-weight="700" fill="#0f172a">Built for: a person</text>
  <text x="62" y="98" font-size="13.5" fill="#475569">the assumption the mesh never stated</text>

  <rect x="66" y="130" width="278" height="96" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="205" y="164" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Fraud analyst</text>
  <text x="205" y="188" font-size="13" fill="#475569" text-anchor="middle">a role, a manager,</text>
  <text x="205" y="206" font-size="13" fill="#475569" text-anchor="middle">accountability</text>

  <rect x="66" y="268" width="278" height="96" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="205" y="302" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Reads the contract</text>
  <text x="205" y="326" font-size="13" fill="#475569" text-anchor="middle">resolves what "customer"</text>
  <text x="205" y="344" font-size="13" fill="#475569" text-anchor="middle">means in her own head</text>

  <rect x="66" y="406" width="278" height="96" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="205" y="440" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Access request</text>
  <text x="205" y="464" font-size="13" fill="#475569" text-anchor="middle">free-text justification,</text>
  <text x="205" y="482" font-size="13" fill="#475569" text-anchor="middle">approved within hours</text>

  <line x1="205" y1="226" x2="205" y2="266" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="205" y1="364" x2="205" y2="404" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="205" y="548" font-size="13" fill="#475569" text-anchor="middle">Human speed: one request,</text>
  <text x="205" y="568" font-size="13" fill="#475569" text-anchor="middle">then a handful of queries</text>

  <!-- CENTER: the data product -->
  <rect x="440" y="150" width="300" height="340" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="590" y="184" font-size="17" font-weight="700" fill="#3730a3" text-anchor="middle">Data product</text>
  <text x="590" y="206" font-size="13.5" fill="#4f46e5" text-anchor="middle">risk_compliance.fraud_scores</text>

  <rect x="462" y="226" width="256" height="70" rx="9" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.4"/>
  <text x="590" y="254" font-size="14.5" font-weight="600" fill="#0f172a" text-anchor="middle">Contract</text>
  <text x="590" y="276" font-size="12.5" fill="#475569" text-anchor="middle">schema, SLAs, quality, masking</text>

  <rect x="462" y="308" width="256" height="70" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="590" y="336" font-size="14.5" font-weight="600" fill="#065f46" text-anchor="middle">OPA policy</text>
  <text x="590" y="358" font-size="12.5" fill="#065f46" text-anchor="middle">inputs: user_id, user_role</text>

  <rect x="462" y="390" width="256" height="70" rx="9" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.4"/>
  <text x="590" y="418" font-size="14.5" font-weight="600" fill="#0f172a" text-anchor="middle">Iceberg table</text>
  <text x="590" y="440" font-size="12.5" fill="#475569" text-anchor="middle">owned by Risk and Compliance</text>

  <!-- human path into product -->
  <path d="M344 454 C 392 454, 400 342, 438 342" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="404" y="306" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">query as</text>
  <text x="404" y="322" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">a person</text>

  <!-- RIGHT: the consumer that is arriving -->
  <rect x="810" y="40" width="330" height="560" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="832" y="76" font-size="18" font-weight="700" fill="#92400e">Arriving: an AI agent</text>
  <text x="832" y="98" font-size="13.5" fill="#b45309">acting for the same analyst</text>

  <rect x="836" y="122" width="278" height="86" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="975" y="154" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">AI agent</text>
  <text x="975" y="178" font-size="12.5" fill="#92400e" text-anchor="middle">autonomous, non-deterministic,</text>
  <text x="975" y="196" font-size="12.5" fill="#92400e" text-anchor="middle">machine-speed</text>

  <rect x="836" y="236" width="278" height="96" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="975" y="266" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Gap 1: meaning</text>
  <text x="975" y="290" font-size="12.5" fill="#475569" text-anchor="middle">can only use what the product</text>
  <text x="975" y="308" font-size="12.5" fill="#475569" text-anchor="middle">declares; schemas are not meaning</text>

  <rect x="836" y="360" width="278" height="96" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="975" y="390" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Gap 2: identity</text>
  <text x="975" y="414" font-size="12.5" fill="#475569" text-anchor="middle">no workload identity, no</text>
  <text x="975" y="432" font-size="12.5" fill="#475569" text-anchor="middle">on-behalf-of, no purpose</text>

  <rect x="836" y="484" width="278" height="96" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="975" y="514" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Gap 3: participation</text>
  <text x="975" y="538" font-size="12.5" fill="#475569" text-anchor="middle">writes derived data with no</text>
  <text x="975" y="556" font-size="12.5" fill="#475569" text-anchor="middle">owner, lineage or retention</text>

  <line x1="975" y1="208" x2="975" y2="234" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrA)"/>
  <line x1="975" y1="332" x2="975" y2="358" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrA)"/>
  <line x1="975" y1="456" x2="975" y2="482" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrA)"/>

  <!-- agent gaps toward product -->
  <line x1="834" y1="284" x2="742" y2="262" stroke="#d97706" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrA)"/>
  <text x="776" y="250" font-size="12" fill="#b45309" text-anchor="middle" font-weight="600">meaning?</text>
  <line x1="834" y1="408" x2="742" y2="344" stroke="#d97706" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrA)"/>
  <text x="779" y="398" font-size="12" fill="#b45309" text-anchor="middle" font-weight="600">which role?</text>
  <line x1="834" y1="532" x2="742" y2="440" stroke="#d97706" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#arrA)"/>
  <text x="768" y="508" font-size="12" fill="#b45309" text-anchor="middle" font-weight="600">writes</text>
  <text x="768" y="523" font-size="12" fill="#b45309" text-anchor="middle" font-weight="600">back?</text>

  <!-- caption -->
  <text x="40" y="640" font-size="13.5" fill="#64748b">One data product, two consumers. The mesh's policy, contract and approval flow all assume the left side.</text>
  <text x="40" y="660" font-size="13.5" fill="#64748b">The three gaps on the right are the three threads of this series: meaning, trust, and the agent as a participant.</text>
</svg>
