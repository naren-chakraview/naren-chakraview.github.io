<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 690" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
  </defs>
  <rect width="1180" height="690" fill="#ffffff"/>
  <text x="40" y="44" font-size="19" fill="#0f172a" text-anchor="start" font-weight="700">Governance as a decision service, and as a trust boundary</text>
  <rect x="30" y="66" width="1120" height="270" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="54" y="98" font-size="15.5" fill="#92400e" text-anchor="start" font-weight="700">Before: the policy evaluates a claim, and the data has its own open doors</text>
  <rect x="54" y="122" width="250" height="96" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="179.0" y="152.8" font-size="15.5" font-weight="650" fill="#92400e" text-anchor="middle">Request body</text>
  <text x="179.0" y="177.7" font-size="12.8" fill="#b45309" text-anchor="middle">user_role: "risk_analyst"</text>
  <text x="179.0" y="196.5" font-size="12.8" fill="#b45309" text-anchor="middle">typed by the caller</text>
  <rect x="434" y="122" width="250" height="96" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="559.0" y="162.2" font-size="15.5" font-weight="650" fill="#0f172a" text-anchor="middle">OPA policy</text>
  <text x="559.0" y="187.1" font-size="12.8" fill="#475569" text-anchor="middle">correct, tested, fail-closed</text>
  <rect x="814" y="122" width="250" height="96" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="939.0" y="162.2" font-size="15.5" font-weight="650" fill="#92400e" text-anchor="middle">"approved"</text>
  <text x="939.0" y="187.1" font-size="12.8" fill="#b45309" text-anchor="middle">no human, no proof</text>
  <line x1="304" y1="170" x2="432" y2="170" stroke="#d97706" stroke-width="1.7" marker-end="url(#arrA)"/>
  <line x1="684" y1="170" x2="812" y2="170" stroke="#d97706" stroke-width="1.7" marker-end="url(#arrA)"/>
  <text x="54" y="250" font-size="13.5" fill="#92400e" text-anchor="start" font-weight="650">Beside the policy, and never consulted by it:</text>
  <rect x="54" y="262" width="200" height="58" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="154.0" y="283.4" font-size="14" font-weight="650" fill="#92400e" text-anchor="middle">Object storage</text>
  <text x="154.0" y="307.0" font-size="11.6" fill="#b45309" text-anchor="middle">default credentials</text>
  <rect x="271" y="262" width="200" height="58" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="371.0" y="283.4" font-size="14" font-weight="650" fill="#92400e" text-anchor="middle">Iceberg catalog</text>
  <text x="371.0" y="307.0" font-size="11.6" fill="#b45309" text-anchor="middle">no authentication</text>
  <rect x="488" y="262" width="200" height="58" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="588.0" y="283.4" font-size="14" font-weight="650" fill="#92400e" text-anchor="middle">SPARQL endpoints</text>
  <text x="588.0" y="307.0" font-size="11.6" fill="#b45309" text-anchor="middle">open writes, PII unmasked</text>
  <rect x="705" y="262" width="200" height="58" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="805.0" y="283.4" font-size="14" font-weight="650" fill="#92400e" text-anchor="middle">Masking + audit</text>
  <text x="805.0" y="307.0" font-size="11.6" fill="#b45309" text-anchor="middle">called only by tests</text>
  <rect x="922" y="262" width="200" height="58" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="1022.0" y="283.4" font-size="14" font-weight="650" fill="#92400e" text-anchor="middle">Lineage</text>
  <text x="1022.0" y="307.0" font-size="11.6" fill="#b45309" text-anchor="middle">an empty module</text>
  <rect x="30" y="360" width="1120" height="306" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="54" y="392" font-size="15.5" fill="#065f46" text-anchor="start" font-weight="700">After: both parties are proven, and every door is behind one boundary per data product</text>
  <rect x="54" y="418" width="250" height="82" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="179.0" y="451.2" font-size="15.5" font-weight="650" fill="#3730a3" text-anchor="middle">Person</text>
  <text x="179.0" y="476.1" font-size="12.8" fill="#4f46e5" text-anchor="middle">signed token from the IdP</text>
  <rect x="54" y="530" width="250" height="82" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="179.0" y="563.2" font-size="15.5" font-weight="650" fill="#3730a3" text-anchor="middle">Workload</text>
  <text x="179.0" y="588.0" font-size="12.8" fill="#4f46e5" text-anchor="middle">SPIFFE client certificate</text>
  <rect x="380" y="454" width="300" height="124" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="530.0" y="498.9" font-size="16.5" font-weight="650" fill="#065f46" text-anchor="middle">Data product boundary</text>
  <text x="530.0" y="524.0" font-size="13" fill="#047857" text-anchor="middle">guardrails AND domain policy</text>
  <text x="530.0" y="543.0" font-size="13" fill="#047857" text-anchor="middle">grant, lineage, masking, audit</text>
  <line x1="304" y1="459" x2="378" y2="500" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <line x1="304" y1="571" x2="378" y2="532" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <rect x="740" y="410" width="386" height="232" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="933" y="436" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">internal network, no published ports</text>
  <rect x="764" y="452" width="338" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="933.0" y="469.3" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">Tables</text>
  <text x="933.0" y="493.1" font-size="11.8" fill="#475569" text-anchor="middle">snapshots with signed lineage</text>
  <rect x="764" y="514" width="338" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="933.0" y="531.3" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">SPARQL</text>
  <text x="933.0" y="555.1" font-size="11.8" fill="#475569" text-anchor="middle">read-only, analyzable subset</text>
  <rect x="764" y="576" width="338" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="933.0" y="605.2" font-size="14" font-weight="650" fill="#0f172a" text-anchor="middle">Policy engine and grants</text>
  <line x1="682" y1="500" x2="762" y2="477" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <line x1="682" y1="520" x2="762" y2="539" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
