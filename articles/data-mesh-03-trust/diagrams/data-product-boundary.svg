<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
  </defs>
  <rect width="1180" height="700" fill="#ffffff"/>
  <text x="40" y="44" font-size="19" fill="#0f172a" text-anchor="start" font-weight="700">The data product boundary</text>
  <rect x="40" y="90" width="230" height="80" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="155.0" y="122.2" font-size="15.5" font-weight="650" fill="#3730a3" text-anchor="middle">Person</text>
  <text x="155.0" y="147.1" font-size="12.8" fill="#4f46e5" text-anchor="middle">signed token</text>
  <rect x="40" y="200" width="230" height="80" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="155.0" y="232.2" font-size="15.5" font-weight="650" fill="#3730a3" text-anchor="middle">Workload</text>
  <text x="155.0" y="257.1" font-size="12.8" fill="#4f46e5" text-anchor="middle">SPIFFE certificate</text>
  <rect x="330" y="140" width="230" height="96" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="445.0" y="170.8" font-size="15.5" font-weight="650" fill="#0f172a" text-anchor="middle">mTLS gateway</text>
  <text x="445.0" y="195.7" font-size="12.8" fill="#475569" text-anchor="middle">verifies the certificate</text>
  <text x="445.0" y="214.5" font-size="12.8" fill="#475569" text-anchor="middle">chain, then mTLS onward</text>
  <line x1="270" y1="130" x2="328" y2="168" stroke="#6366f1" stroke-width="1.7" marker-end="url(#arrI)"/>
  <line x1="270" y1="240" x2="328" y2="208" stroke="#6366f1" stroke-width="1.7" marker-end="url(#arrI)"/>
  <rect x="610" y="70" width="540" height="560" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="880" y="100" font-size="15" fill="#065f46" text-anchor="middle" font-weight="700">One boundary per data product: every step fails closed</text>
  <rect x="650" y="120" width="460" height="62" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="880.0" y="143.3" font-size="15" font-weight="650" fill="#065f46" text-anchor="middle">Verify both identities</text>
  <text x="880.0" y="167.7" font-size="12.3" fill="#047857" text-anchor="middle">roles from verified claims only</text>
  <rect x="650" y="204" width="460" height="62" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="880.0" y="227.3" font-size="15" font-weight="650" fill="#065f46" text-anchor="middle">Platform guardrails AND domain policy</text>
  <text x="880.0" y="251.7" font-size="12.3" fill="#047857" text-anchor="middle">stricter masking wins</text>
  <line x1="880" y1="182" x2="880" y2="202" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <rect x="650" y="288" width="460" height="62" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="880.0" y="311.4" font-size="15" font-weight="650" fill="#065f46" text-anchor="middle">Grant check</text>
  <text x="880.0" y="335.7" font-size="12.3" fill="#047857" text-anchor="middle">person, workload, columns, purpose, expiry</text>
  <line x1="880" y1="266" x2="880" y2="286" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <rect x="650" y="372" width="460" height="62" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="880.0" y="395.4" font-size="15" font-weight="650" fill="#065f46" text-anchor="middle">Lineage check</text>
  <text x="880.0" y="419.7" font-size="12.3" fill="#047857" text-anchor="middle">signed by the producer this product expects</text>
  <line x1="880" y1="350" x2="880" y2="370" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <rect x="650" y="456" width="460" height="62" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="880.0" y="479.4" font-size="15" font-weight="650" fill="#065f46" text-anchor="middle">Masking</text>
  <text x="880.0" y="503.7" font-size="12.3" fill="#047857" text-anchor="middle">by predicate or column, never by name</text>
  <line x1="880" y1="434" x2="880" y2="454" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <rect x="650" y="540" width="460" height="62" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="880.0" y="563.4" font-size="15" font-weight="650" fill="#065f46" text-anchor="middle">Audit record</text>
  <text x="880.0" y="587.6" font-size="12.3" fill="#047857" text-anchor="middle">who, through what, which policy, grant, lineage</text>
  <line x1="880" y1="518" x2="880" y2="538" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <line x1="560" y1="188" x2="648" y2="151" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <rect x="330" y="470" width="230" height="96" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="445.0" y="500.8" font-size="15.5" font-weight="650" fill="#0f172a" text-anchor="middle">Tables and SPARQL</text>
  <text x="445.0" y="525.6" font-size="12.8" fill="#475569" text-anchor="middle">internal network only</text>
  <text x="445.0" y="544.4" font-size="12.8" fill="#475569" text-anchor="middle">no update endpoints</text>
  <line x1="608" y1="518" x2="562" y2="518" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="40" y="470" width="230" height="96" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="155.0" y="500.8" font-size="15.5" font-weight="650" fill="#92400e" text-anchor="middle">Producer</text>
  <text x="155.0" y="525.6" font-size="12.8" fill="#b45309" text-anchor="middle">signs each snapshot</text>
  <text x="155.0" y="544.4" font-size="12.8" fill="#b45309" text-anchor="middle">(in-toto, DSSE)</text>
  <line x1="270" y1="518" x2="328" y2="518" stroke="#d97706" stroke-width="1.7" marker-end="url(#arrA)"/>
  <text x="40" y="650" font-size="13" fill="#475569" text-anchor="start" font-weight="400">Platform team owns the guardrails; each domain owns its product policy (CODEOWNERS).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
