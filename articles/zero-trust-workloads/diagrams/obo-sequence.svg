<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- lifelines -->
  <g stroke="#cbd5e1" stroke-width="1.4">
    <line x1="120" y1="78" x2="120" y2="650"/>
    <line x1="375" y1="78" x2="375" y2="650"/>
    <line x1="620" y1="78" x2="620" y2="650"/>
    <line x1="860" y1="78" x2="860" y2="650"/>
    <line x1="1085" y1="78" x2="1085" y2="650"/>
  </g>

  <!-- actor headers -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="48" y="26" width="144" height="46" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="120" y="47" fill="#0f172a">User</text>
    <text x="120" y="64" font-size="11" font-weight="400" fill="#64748b">user@corp.internal</text>

    <rect x="303" y="26" width="144" height="46" rx="8" fill="#e2e8f0" stroke="#475569"/>
    <text x="375" y="54" fill="#0f172a">API Gateway</text>

    <rect x="548" y="26" width="144" height="46" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="620" y="54" fill="#92400e">AI Agent</text>

    <rect x="788" y="26" width="144" height="46" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="860" y="47" fill="#065f46">OPA</text>
    <text x="860" y="64" font-size="11" font-weight="400" fill="#059669">capability policy</text>

    <rect x="1013" y="26" width="144" height="46" rx="8" fill="#e2e8f0" stroke="#475569"/>
    <text x="1085" y="47" fill="#0f172a">Inventory</text>
    <text x="1085" y="64" font-size="11" font-weight="400" fill="#64748b">Service</text>
  </g>

  <!-- messages -->
  <g font-size="12.5" text-anchor="middle">
    <!-- 1 User -> GW -->
    <line x1="120" y1="112" x2="373" y2="112" stroke="#334155" stroke-width="1.7" marker-end="url(#s)"/>
    <text x="247" y="104" fill="#334155">authenticated request</text>

    <!-- note on GW -->
    <rect x="300" y="128" width="190" height="44" rx="6" fill="#fff7ed" stroke="#fb923c"/>
    <text x="395" y="148" font-size="11.5" fill="#9a3412">mints JWT SVID + OBO token</text>
    <text x="395" y="164" font-size="11.5" fill="#9a3412">principal = user</text>

    <!-- 2 GW -> Agent -->
    <line x1="375" y1="206" x2="618" y2="206" stroke="#334155" stroke-width="1.7" marker-end="url(#s)"/>
    <text x="497" y="190" fill="#334155">call over mTLS</text>
    <text x="497" y="204" fill="#334155">+ OBO token + user principal</text>

    <!-- 3 Agent -> OPA -->
    <line x1="620" y1="258" x2="858" y2="258" stroke="#334155" stroke-width="1.7" marker-end="url(#s)"/>
    <text x="740" y="242" fill="#334155">may this agent act for this user?</text>
    <text x="740" y="256" fill="#334155">(capabilities · chain depth · TTL)</text>

    <!-- 4 OPA --> Agent -->
    <line x1="860" y1="300" x2="622" y2="300" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#d)"/>
    <text x="740" y="292" fill="#475569">allow · scoped to permitted tools</text>

    <!-- 5 Agent -> Svc -->
    <line x1="620" y1="352" x2="1083" y2="352" stroke="#334155" stroke-width="1.7" marker-end="url(#s)"/>
    <text x="851" y="336" fill="#334155">tool call over mTLS</text>
    <text x="851" y="350" fill="#334155">+ extended OBO chain</text>

    <!-- 6 Svc -> OPA -->
    <line x1="1085" y1="398" x2="862" y2="398" stroke="#334155" stroke-width="1.7" marker-end="url(#s)"/>
    <text x="973" y="390" fill="#334155">validate chain (audience · depth · TTL)</text>

    <!-- 7 OPA --> Svc -->
    <line x1="860" y1="438" x2="1083" y2="438" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#d)"/>
    <text x="973" y="430" fill="#475569">allow</text>

    <!-- 8 Svc --> Agent -->
    <line x1="1085" y1="482" x2="622" y2="482" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#d)"/>
    <text x="851" y="474" fill="#475569">result</text>

    <!-- 9 Agent --> GW -->
    <line x1="620" y1="524" x2="377" y2="524" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#d)"/>
    <text x="497" y="516" fill="#475569">result</text>

    <!-- 10 GW --> User -->
    <line x1="375" y1="566" x2="122" y2="566" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#d)"/>
    <text x="247" y="558" fill="#475569">response</text>
  </g>

  <!-- banner -->
  <rect x="120" y="612" width="965" height="56" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="602" y="638" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="middle">Attested end to end, every hop:</text>
  <text x="602" y="658" font-size="13.5" fill="#065f46" text-anchor="middle">user@corp.internal  →  API Gateway  →  AI Agent  →  Inventory Service</text>
</svg>
