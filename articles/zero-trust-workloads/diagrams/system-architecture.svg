<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1180" height="660" fill="#ffffff"/>

  <!-- MESH BAND -->
  <rect x="50" y="80" width="660" height="520" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="74" y="116" font-size="19" font-weight="700" fill="#0f172a">Network Plane · Service Mesh</text>
  <text x="74" y="140" font-size="14" fill="#475569">strict mTLS · default-deny authorization</text>

  <!-- Gateway -->
  <rect x="96" y="180" width="236" height="86" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="214" y="214" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Zero-Trust Gateway</text>
  <text x="214" y="238" font-size="13" fill="#475569" text-anchor="middle">sidecar or dedicated</text>

  <!-- Legacy -->
  <rect x="96" y="340" width="236" height="86" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="214" y="372" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Legacy App</text>
  <text x="214" y="396" font-size="13" fill="#475569" text-anchor="middle">binds 127.0.0.1 only · unmodified</text>

  <!-- gateway -> legacy -->
  <line x1="214" y1="266" x2="214" y2="338" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="226" y="306" font-size="12.5" fill="#475569">localhost</text>

  <!-- AI Agent -->
  <rect x="424" y="180" width="238" height="92" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="543" y="212" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">AI Agent</text>
  <text x="543" y="236" font-size="13" fill="#92400e" text-anchor="middle">non-deterministic workload</text>
  <text x="543" y="256" font-size="12.5" fill="#b45309" text-anchor="middle">bounded by capability policy</text>

  <!-- Modern Service -->
  <rect x="424" y="356" width="238" height="86" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="543" y="404" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Modern Service</text>

  <!-- mTLS edges -->
  <line x1="543" y1="272" x2="543" y2="354" stroke="#334155" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="555" y="318" font-size="12.5" fill="#334155">mTLS</text>
  <path d="M332 236 C 380 236, 384 390, 422 396" fill="none" stroke="#334155" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="352" y="330" font-size="12.5" fill="#334155">mTLS</text>

  <!-- CONTROL / OBSERVABILITY COLUMN -->
  <!-- Identity -->
  <rect x="820" y="96" width="320" height="120" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="844" y="132" font-size="17" font-weight="700" fill="#3730a3">Identity Plane · SPIFFE/SPIRE</text>
  <text x="844" y="160" font-size="13.5" fill="#3730a3">Short-TTL, auto-rotated X.509 + JWT</text>
  <text x="844" y="180" font-size="13.5" fill="#3730a3">SVIDs issued to every workload.</text>
  <text x="844" y="200" font-size="13.5" fill="#6366f1">Identity is attested, not configured.</text>

  <!-- Policy -->
  <rect x="820" y="270" width="320" height="120" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text x="844" y="306" font-size="17" font-weight="700" fill="#065f46">Policy Plane · OPA</text>
  <text x="844" y="334" font-size="13.5" fill="#065f46">Admission control + per-request authz.</text>
  <text x="844" y="354" font-size="13.5" fill="#065f46">Agent capability policy: which tools,</text>
  <text x="844" y="374" font-size="13.5" fill="#059669">which scopes, which actions.</text>

  <!-- Observability -->
  <rect x="820" y="444" width="320" height="120" rx="11" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="844" y="480" font-size="17" font-weight="700" fill="#334155">Observability · OpenTelemetry</text>
  <text x="844" y="508" font-size="13.5" fill="#334155">Traces · OPA decision logs · SVID metrics.</text>
  <text x="844" y="528" font-size="13.5" fill="#334155">OBO enrichment promotes delegation</text>
  <text x="844" y="548" font-size="13.5" fill="#64748b">headers into span attributes.</text>

  <!-- connectors mesh <-> column -->
  <!-- Identity -> mesh (SVIDs) dashed -->
  <line x1="820" y1="156" x2="712" y2="156" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrI)"/>
  <text x="766" y="148" font-size="12.5" fill="#4f46e5" text-anchor="middle" font-weight="600">SVIDs</text>

  <!-- Policy <-> mesh (authorize) solid -->
  <line x1="712" y1="330" x2="820" y2="330" stroke="#475569" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="766" y="322" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="600">authorize</text>

  <!-- mesh -> observability (telemetry) dotted -->
  <line x1="712" y1="504" x2="820" y2="504" stroke="#64748b" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#arrG)"/>
  <text x="766" y="496" font-size="12.5" fill="#64748b" text-anchor="middle" font-weight="600">telemetry</text>

  <!-- caption strip -->
  <text x="50" y="636" font-size="13.5" fill="#64748b">Three planes fail independently. Legacy apps join via the gateway without code changes; AI agents join as first-class, policy-bounded workloads.</text>
</svg>
