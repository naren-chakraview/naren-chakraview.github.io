<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker>
  </defs>
  <rect width="1180" height="640" fill="#ffffff"/>
  <text x="40" y="44" font-size="19" fill="#0f172a" text-anchor="start" font-weight="700">Delegation, proven at every hop</text>
  <rect x="40" y="110" width="200" height="96" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="140.0" y="140.8" font-size="15.5" font-weight="650" fill="#3730a3" text-anchor="middle">Analyst</text>
  <text x="140.0" y="165.7" font-size="12.8" fill="#4f46e5" text-anchor="middle">IdP token, her roles</text>
  <text x="140.0" y="184.5" font-size="12.8" fill="#4f46e5" text-anchor="middle">(consent to the task)</text>
  <rect x="290" y="70" width="330" height="300" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="306" y="94" font-size="12.5" fill="#475569" text-anchor="start" font-weight="600">agent's network namespace</text>
  <rect x="320" y="110" width="270" height="84" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="455.0" y="134.8" font-size="15.5" font-weight="650" fill="#0f172a" text-anchor="middle">Agent</text>
  <text x="455.0" y="159.7" font-size="12.8" fill="#475569" text-anchor="middle">scripted, holds no credential</text>
  <text x="455.0" y="178.5" font-size="12.8" fill="#475569" text-anchor="middle">of its own</text>
  <rect x="320" y="250" width="270" height="96" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="455.0" y="281.4" font-size="14.5" font-weight="650" fill="#3730a3" text-anchor="middle">Agent sidecar (zero-trust-rs)</text>
  <text x="455.0" y="305.4" font-size="12" fill="#4f46e5" text-anchor="middle">mints per request: user = analyst,</text>
  <text x="455.0" y="323.4" font-size="12" fill="#4f46e5" text-anchor="middle">actor = agent, bound to its cert</text>
  <line x1="455" y1="194" x2="455" y2="248" stroke="#6366f1" stroke-width="1.7" marker-end="url(#arrI)"/>
  <line x1="455" y1="248" x2="455" y2="196" stroke="#6366f1" stroke-width="1.7" marker-end="url(#arrI)"/>
  <text x="470" y="226" font-size="12" fill="#4f46e5" text-anchor="start" font-weight="400">loopback</text>
  <line x1="240" y1="158" x2="318" y2="152" stroke="#6366f1" stroke-width="1.7" marker-end="url(#arrI)"/>
  <rect x="700" y="70" width="450" height="420" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="716" y="94" font-size="12.5" fill="#475569" text-anchor="start" font-weight="600">boundary's network namespace</text>
  <rect x="730" y="110" width="390" height="150" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="925.0" y="149.9" font-size="15" font-weight="650" fill="#065f46" text-anchor="middle">Boundary sidecar (zero-trust-rs)</text>
  <text x="925.0" y="174.2" font-size="12.3" fill="#047857" text-anchor="middle">signature, trusted issuer, expiry, single use</text>
  <text x="925.0" y="192.5" font-size="12.3" fill="#047857" text-anchor="middle">actor must be the mTLS peer</text>
  <text x="925.0" y="210.8" font-size="12.3" fill="#047857" text-anchor="middle">token bound to the presenting cert</text>
  <text x="925.0" y="229.1" font-size="12.3" fill="#047857" text-anchor="middle">capability policy: user AND agent</text>
  <rect x="730" y="320" width="390" height="140" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="925.0" y="354.9" font-size="15" font-weight="650" fill="#065f46" text-anchor="middle">Data product boundary</text>
  <text x="925.0" y="379.2" font-size="12.3" fill="#047857" text-anchor="middle">re-verifies the forwarded token</text>
  <text x="925.0" y="397.5" font-size="12.3" fill="#047857" text-anchor="middle">person ∩ agent capability ∩ product</text>
  <text x="925.0" y="415.8" font-size="12.3" fill="#047857" text-anchor="middle">grant must name the agent</text>
  <text x="925.0" y="434.1" font-size="12.3" fill="#047857" text-anchor="middle">masked rows, audited with the chain</text>
  <line x1="925" y1="262" x2="925" y2="318" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <text x="940" y="296" font-size="12" fill="#047857" text-anchor="start" font-weight="400">loopback, same namespace</text>
  <line x1="592" y1="170" x2="728" y2="170" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <text x="660" y="148" font-size="12.5" fill="#047857" text-anchor="middle" font-weight="600">mTLS + token</text>
  <text x="40" y="540" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">Refused, each with its own reason:</text>
  <rect x="40" y="556" width="262" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="171.0" y="581.3" font-size="14" font-weight="650" fill="#92400e" text-anchor="middle">wrong certificate</text>
  <text x="171.0" y="605.1" font-size="11.8" fill="#b45309" text-anchor="middle">certificate_binding_mismatch</text>
  <rect x="322" y="556" width="262" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="453.0" y="581.3" font-size="14" font-weight="650" fill="#92400e" text-anchor="middle">actor is not the peer</text>
  <text x="453.0" y="605.1" font-size="11.8" fill="#b45309" text-anchor="middle">obo_token_subject_mismatch</text>
  <rect x="604" y="556" width="262" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="735.0" y="581.3" font-size="14" font-weight="650" fill="#92400e" text-anchor="middle">replayed token</text>
  <text x="735.0" y="605.1" font-size="11.8" fill="#b45309" text-anchor="middle">single use (jti)</text>
  <rect x="886" y="556" width="262" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="1017.0" y="581.3" font-size="14" font-weight="650" fill="#92400e" text-anchor="middle">no client certificate</text>
  <text x="1017.0" y="605.1" font-size="11.8" fill="#b45309" text-anchor="middle">no_verified_peer</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
