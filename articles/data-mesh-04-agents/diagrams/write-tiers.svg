  </defs>
  <rect width="1180" height="760" fill="#ffffff"/>
  <text x="40" y="44" font-size="19" fill="#0f172a" text-anchor="start" font-weight="700">The human gate follows who decided the data</text>
  <rect x="40" y="300" width="190" height="100" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="135.0" y="332.8" font-size="15.5" font-weight="650" fill="#0f172a" text-anchor="middle">A write</text>
  <text x="135.0" y="357.6" font-size="12.8" fill="#475569" text-anchor="middle">from a service</text>
  <text x="135.0" y="376.4" font-size="12.8" fill="#475569" text-anchor="middle">or an agent</text>
  <rect x="280" y="285" width="220" height="130" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="390.0" y="333.2" font-size="15.5" font-weight="650" fill="#3730a3" text-anchor="middle">Who decided the data?</text>
  <text x="390.0" y="357.6" font-size="12.4" fill="#4f46e5" text-anchor="middle">the contract and the</text>
  <text x="390.0" y="376.0" font-size="12.4" fill="#4f46e5" text-anchor="middle">column classifications</text>
  <line x1="230" y1="350" x2="278" y2="350" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
  <rect x="570" y="75" width="300" height="140" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
  <text x="720.0" y="110.2" font-size="15.5" font-weight="650" fill="#0f172a" text-anchor="middle">Direct</text>
  <text x="720.0" y="134.4" font-size="12.2" fill="#475569" text-anchor="middle">captured: the customer decided</text>
  <text x="720.0" y="152.6" font-size="12.2" fill="#475569" text-anchor="middle">derived, not sensitive</text>
  <text x="720.0" y="170.8" font-size="12.2" fill="#475569" text-anchor="middle">derived, confidential or personal:</text>
  <text x="720.0" y="189.0" font-size="12.2" fill="#475569" text-anchor="middle">the listed producer service</text>
  <rect x="570" y="245" width="300" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="720.0" y="278.3" font-size="15" font-weight="650" fill="#3730a3" text-anchor="middle">Owner proposal</text>
  <text x="720.0" y="302.5" font-size="12.2" fill="#4f46e5" text-anchor="middle">an agent's derived</text>
  <text x="720.0" y="320.7" font-size="12.2" fill="#4f46e5" text-anchor="middle">confidential or sensitive output</text>
  <rect x="570" y="375" width="300" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="720.0" y="408.3" font-size="15" font-weight="650" fill="#3730a3" text-anchor="middle">Consent proposal</text>
  <text x="720.0" y="432.5" font-size="12.2" fill="#4f46e5" text-anchor="middle">an agent's derived personal value</text>
  <text x="720.0" y="450.7" font-size="12.2" fill="#4f46e5" text-anchor="middle">about one person</text>
  <rect x="570" y="505" width="300" height="90" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="720.0" y="533.3" font-size="15" font-weight="650" fill="#92400e" text-anchor="middle">Refused (422)</text>
  <text x="720.0" y="557.5" font-size="12.2" fill="#b45309" text-anchor="middle">an agent's derived personal data</text>
  <text x="720.0" y="575.7" font-size="12.2" fill="#b45309" text-anchor="middle">about several people or no one</text>
  <line x1="500" y1="320" x2="568" y2="150" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
  <line x1="500" y1="340" x2="568" y2="295" stroke="#6366f1" stroke-width="1.7" marker-end="url(#arrI)"/>
  <line x1="500" y1="360" x2="568" y2="420" stroke="#6366f1" stroke-width="1.7" marker-end="url(#arrI)"/>
  <line x1="500" y1="380" x2="568" y2="545" stroke="#d97706" stroke-width="1.7" marker-end="url(#arrA)"/>
  <rect x="930" y="75" width="220" height="140" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="1040.0" y="119.0" font-size="15" font-weight="650" fill="#065f46" text-anchor="middle">New snapshot, now</text>
  <text x="1040.0" y="143.3" font-size="12.3" fill="#047857" text-anchor="middle">accepted_by: policy</text>
  <text x="1040.0" y="161.7" font-size="12.3" fill="#047857" text-anchor="middle">(platform and domain</text>
  <text x="1040.0" y="180.0" font-size="12.3" fill="#047857" text-anchor="middle">revisions), signed</text>
  <line x1="872" y1="145" x2="928" y2="145" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <rect x="930" y="245" width="220" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="1040.0" y="278.1" font-size="14.5" font-weight="650" fill="#065f46" text-anchor="middle">Domain owner accepts</text>
  <text x="1040.0" y="302.4" font-size="12.3" fill="#047857" text-anchor="middle">new snapshot,</text>
  <text x="1040.0" y="320.7" font-size="12.3" fill="#047857" text-anchor="middle">accepted_by: the owner</text>
  <line x1="872" y1="295" x2="928" y2="295" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <rect x="930" y="375" width="220" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="1040.0" y="408.1" font-size="14.5" font-weight="650" fill="#065f46" text-anchor="middle">The person accepts</text>
  <text x="1040.0" y="432.4" font-size="12.3" fill="#047857" text-anchor="middle">captured again,</text>
  <text x="1040.0" y="450.7" font-size="12.3" fill="#047857" text-anchor="middle">accepted_by: her, signed</text>
  <line x1="872" y1="425" x2="928" y2="425" stroke="#059669" stroke-width="1.7" marker-end="url(#arrE)"/>
  <text x="1040" y="522" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="400">Only she can accept: not</text>
  <text x="1040" y="540" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="400">the agent, not the owner.</text>
  <text x="1040" y="566" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">The owner can roll back</text>
  <text x="1040" y="584" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="400">a write; rollback is signed.</text>
  <rect x="40" y="640" width="1110" height="76" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="595.0" y="670.3" font-size="15" font-weight="650" fill="#065f46" text-anchor="middle">Same automated gates on every write, direct or proposed</text>
  <text x="595.0" y="694.7" font-size="12.4" fill="#047857" text-anchor="middle">verified identity and delegation · a write grant · person ∩ agent ∩ product · contract · SHACL shapes · rate and size limits · an agent's derived write cites what it read</text>
