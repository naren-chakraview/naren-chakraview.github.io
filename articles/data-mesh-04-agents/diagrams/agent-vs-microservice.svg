<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 604" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1180" height="604" fill="#ffffff"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#0f172a">How an agent differs from a microservice</text>
<rect x="40" y="78" width="1100" height="498" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<path d="M40 128 V90 a12 12 0 0 1 12 -12 H1128 a12 12 0 0 1 12 12 V128 Z" fill="#eef2ff"/>
<text x="60" y="109" font-size="14.5" font-weight="700" fill="#3730a3"></text>
<text x="360" y="109" font-size="14.5" font-weight="700" fill="#3730a3">Microservice</text>
<text x="720" y="109" font-size="14.5" font-weight="700" fill="#3730a3">Agent</text>
<line x1="40" y1="128" x2="1140" y2="128" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="60" y="161" font-size="14" font-weight="650" fill="#0f172a">Acts for</text>
<text x="366" y="161" font-size="14" fill="#334155" font-weight="400">itself</text>
<text x="726" y="161" font-size="14" fill="#334155" font-weight="400">a person, through a proven delegation</text>
<rect x="41" y="184" width="1098" height="56" fill="#f8fafc"/>
<line x1="40" y1="184" x2="1140" y2="184" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="60" y="217" font-size="14" font-weight="650" fill="#0f172a">Decides</text>
<text x="366" y="217" font-size="14" fill="#334155" font-weight="400">at deploy time</text>
<text x="726" y="217" font-size="14" fill="#334155" font-weight="400">per request, at run time</text>
<line x1="40" y1="240" x2="1140" y2="240" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="60" y="273" font-size="14" font-weight="650" fill="#0f172a">Reviewed by a person</text>
<text x="366" y="273" font-size="14" fill="#334155" font-weight="400">once, in code review</text>
<text x="726" y="273" font-size="14" fill="#334155" font-weight="400">not before it acts</text>
<rect x="41" y="296" width="1098" height="56" fill="#f8fafc"/>
<line x1="40" y1="296" x2="1140" y2="296" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="60" y="329" font-size="14" font-weight="650" fill="#0f172a">Access</text>
<text x="366" y="329" font-size="14" fill="#334155" font-weight="400">its own grant</text>
<text x="726" y="329" font-size="14" fill="#334155" font-weight="400">person ∩ its capability ∩ product</text>
<line x1="40" y1="352" x2="1140" y2="352" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="60" y="385" font-size="14" font-weight="650" fill="#0f172a">Cites what it read</text>
<text x="366" y="385" font-size="14" fill="#334155" font-weight="400">no</text>
<text x="726" y="385" font-size="14" fill="#334155" font-weight="400">yes, for every derived write</text>
<rect x="41" y="408" width="1098" height="56" fill="#f8fafc"/>
<line x1="40" y1="408" x2="1140" y2="408" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="60" y="441" font-size="14" font-weight="650" fill="#0f172a">Who approves its writes</text>
<rect x="352" y="416" width="5" height="40" rx="2.5" fill="#10b981"/>
<text x="366" y="441" font-size="14" fill="#047857" font-weight="600">policy, for every write</text>
<rect x="712" y="416" width="5" height="40" rx="2.5" fill="#10b981"/>
<text x="726" y="432" font-size="14" fill="#047857" font-weight="600">policy, for captured and</text>
<text x="726" y="450" font-size="14" fill="#047857" font-weight="600">non-sensitive data</text>
<rect x="41" y="464" width="1098" height="56" fill="#f8fafc"/>
<text x="60" y="497" font-size="14" font-weight="650" fill="#0f172a"></text>
<text x="366" y="497" font-size="14" fill="#334155" font-weight="400"></text>
<rect x="712" y="472" width="5" height="40" rx="2.5" fill="#6366f1"/>
<text x="726" y="488" font-size="14" fill="#4338ca" font-weight="600">the domain's owner, for its</text>
<text x="726" y="506" font-size="14" fill="#4338ca" font-weight="600">confidential conclusions</text>
<path d="M41 520 H1139 V564 a11 11 0 0 1 -11 11 H52 a11 11 0 0 1 -11 -11 Z" fill="#f8fafc"/>
<text x="60" y="553" font-size="14" font-weight="650" fill="#0f172a"></text>
<text x="366" y="553" font-size="14" fill="#334155" font-weight="400"></text>
<rect x="712" y="528" width="5" height="40" rx="2.5" fill="#6366f1"/>
<text x="726" y="544" font-size="14" fill="#4338ca" font-weight="600">the person it describes, for</text>
<text x="726" y="562" font-size="14" fill="#4338ca" font-weight="600">personal values it derived</text>
<rect x="40" y="78" width="1100" height="498" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.4"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
